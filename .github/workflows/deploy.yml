name: Deploy to Render

on:
  push:
    branches:
      - rama-diego

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, pdo, pdo_pgsql, pgsql
          coverage: none

      - name: Validar secretos requeridos
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK no está configurado."
            exit 1
          fi
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "ERROR: ENV_FILE no está configurado."
            exit 1
          fi

      - name: Generar archivo .env desde secret
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Verificar archivo .env
        run: |
          test -f .env
          echo ".env generado correctamente"
          echo "DB_CONNECTION=$(grep DB_CONNECTION .env | cut -d '=' -f2)"
          echo "APP_ENV=$(grep APP_ENV .env | cut -d '=' -f2)"

      - name: Instalar dependencias Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Optimizar Laravel
        run: |
          php artisan key:generate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Disparar despliegue en Render
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Confirmar despliegue solicitado
        run: echo "Solicitud de despliegue enviada correctamente a Render."